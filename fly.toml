# fly.toml app configuration file generated for recipe-finder

app = "recipe-finder"
primary_region = "ord"

[build]
builder = "paket"

[env]
  RAILS_ENV = "production"
  RAILS_MASTER_KEY = ""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    hard_limit = 1000
    soft_limit = 512

[processes]
  web = "bundle exec puma -t 5:5 -w 1 -b tcp://0.0.0.0:3000"
  worker = "bundle exec solid_queue:start"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "storage"
  destination = "/app/storage"

[[mounts]]
  source = "logs"
  destination = "/app/log"

[checks]
  [checks.http]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    protocol = "HTTP"
    timeout = "5s"
